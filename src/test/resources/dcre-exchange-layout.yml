# TEST layout: shadows the platform-batch classpath resource of the same name so
# `spring.config.import: classpath:dcre-exchange-layout.yml` binds these values under test.
# root -> build/test-exchange (per-client tree materialized there); the mandate state-delta
# report lands at <root>/<client>/onhost-resp-man/out/<client>_MSD_<window>.txt. The three
# canonical mandate-capable clients mirror production; FNBT00..FNBT15 is an isolation pool so
# each scenario draws a distinct configured client (watermark/report rows are client-global,
# so a shared client would collide).
dcre:
  exchange:
    enabled: true
    root: ${DCRE_EXCHANGE_ROOT:build/test-exchange}
    clients:
      "[FNBCC01]":
        onhost-resp-man: { out: fnbcc01/onhost-resp-man/out, error: fnbcc01/onhost-resp-man/error, archive: fnbcc01/onhost-resp-man/archive }
      "[FNBCC02]":
        onhost-resp-man: { out: fnbcc02/onhost-resp-man/out, error: fnbcc02/onhost-resp-man/error, archive: fnbcc02/onhost-resp-man/archive }
      "[FNBRF01]":
        onhost-resp-man: { out: fnbrf01/onhost-resp-man/out, error: fnbrf01/onhost-resp-man/error, archive: fnbrf01/onhost-resp-man/archive }
      "[FNBT00]": { onhost-resp-man: { out: fnbt00/onhost-resp-man/out, error: fnbt00/onhost-resp-man/error, archive: fnbt00/onhost-resp-man/archive } }
      "[FNBT01]": { onhost-resp-man: { out: fnbt01/onhost-resp-man/out, error: fnbt01/onhost-resp-man/error, archive: fnbt01/onhost-resp-man/archive } }
