# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  # SCRUM-42/73: per-client exchange layout, shipped once as a shared classpath resource in
  # platform-batch and imported by each writer service; drives the ExchangeLayout bean.
  config:
    import: classpath:dcre-exchange-layout.yml
  threads:
    virtual:
      enabled: true
  batch:
    # SCRUM-91: MRG now ships two jobs (clock-window state-delta report / suspension sweep
    # absorbed from msrSuspendJob); AGT selects one per launch. Default = the report job;
    # the man clock overrides DCRE_MRG_JOB_NAME with mrgSuspendJob.
    job:
      name: ${DCRE_MRG_JOB_NAME:mrgJob}
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
    hikari:
      # SCRUM-90: mrg-ONLY READ COMMITTED (not fleet-wide), same profile as crg. mrg is a
      # scheduled per-client report generator whose concurrent windows hit the same uncatchable
      # 40001 (RETRY_SERIALIZABLE) at the Batch-6 persistent-JobRepository chunk commit as crg.
      # READ COMMITTED removes it and mrg's writes are full-identity guarded UPSERTs (watermark
      # ON CONFLICT (client, mandate_ref); ledger partial-unique ON CONFLICT (client, mandate_ref,
      # state) WHERE manual_ref IS NULL) so zero-dup is preserved. mrg mirrors crg exactly and
      # uses NO cluster_logical_timestamp() / AS OF SYSTEM TIME (its delta read is a plain SELECT
      # over the derived mandate_effective_status view), so it is RC-safe; only ctv/rpt keep the
      # SERIALIZABLE default because they use AS OF SYSTEM TIME, which CRDB allows only there.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as MRG_BATCH_)
    database-change-log-table: mrg_databasechangelog
    database-change-log-lock-table: mrg_databasechangeloglock

dcre:
  batch:
    table-prefix: MRG_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  # Second, READ-ONLY datasource pointed at the collections DB (dcre_col) for the suspension
  # sweep (HeartbeatDatasourceConfig pattern: inline SimpleDriverDataSource, never a
  # DataSource bean, so Liquibase/Batch/Spring-Data stay on the primary dcre_man). Moved here
  # verbatim from msr with the sweep (SCRUM-91).
  # The localhost default is the clean-clone dev target ONLY: ColDatasourceConfig makes it
  # fatal at startup inside a pod, because nothing injected DCRE_COL_DB_URL and every
  # in-cluster sweep window died on it (2026-07-26). AGT now sets it on the sweep launch.
  # Keep this literal in step with ColDatasourceConfig.LOCAL_DEV_URL (parity-tested).
  col-db-url: ${DCRE_COL_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
  col-db-user: ${DCRE_COL_DB_USER:root}
  col-db-password: ${DCRE_COL_DB_PASSWORD:}
  msr:
    # Consecutive terminal-failed collections (dcre_col) that suspend an ACCP mandate.
    # DELIBERATELY still keyed dcre.msr.*: carried over with the sweep so the operational
    # contract does not change under whoever tuned it. Verified 2026-07-25: infra/dcre-infra
    # sets no DCRE_MSR_SUSPEND_AFTER and launches no msrSuspendJob, so nothing external is
    # pinned to the name today and a rename is free whenever the register decides to make
    # it (plan Task 10).
    suspend-after: ${DCRE_MSR_SUSPEND_AFTER:3}
  mrg:
    # StagedWrite v1 reads the mandate state-delta in bounded keyset slices of this size and
    # advances the watermark/ledger slice by slice; StreamedPsrWrite is the future path if
    # mandate volumes ever demand streaming (note only, per plan T14).
    slice-size: ${DCRE_MRG_SLICE_SIZE:5000}
